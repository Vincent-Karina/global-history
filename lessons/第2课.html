<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第2课 · 采集—农业转折 | UNA · 全球历史</title>
<style>
:root {
  --bronze: #b08d57;
  --bronze-dark: #8a6a3a;
  --ink: #2a2118;
  --paper: #faf6ef;
  --card: #fffdf8;
  --muted: #6b5b4a;
  --line: #e6dcc8;
  --ok: #2f6b4f;
  --warn: #9a6b2f;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #f3ebe0 0%, var(--paper) 40%, #f7f1e6 100%);
  color: var(--ink);
  line-height: 1.6;
}
a { color: var(--bronze-dark); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
header.hero {
  background: linear-gradient(135deg, #3d2e1c 0%, #6b4e2e 55%, #b08d57 100%);
  color: #fff8ec;
  border-radius: 18px;
  padding: 28px 24px;
  box-shadow: 0 10px 30px rgba(60,40,20,.18);
}
header.hero .brand { opacity: .85; letter-spacing: .12em; font-size: .85rem; }
header.hero h1 { margin: 8px 0 6px; font-size: clamp(1.6rem, 4vw, 2.2rem); }
header.hero p { margin: 0; opacity: .92; max-width: 42rem; }
.nav { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 8px; }
.nav a {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 8px 12px;
  border-radius: 999px;
  color: var(--ink);
  font-size: .92rem;
}
.week { margin-top: 28px; }
.week h2 {
  margin: 0 0 4px;
  font-size: 1.25rem;
  color: var(--bronze-dark);
  border-bottom: 2px solid var(--bronze);
  display: inline-block;
  padding-bottom: 2px;
}
.week .sub { color: var(--muted); margin: 0 0 14px; font-size: .95rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  box-shadow: 0 4px 14px rgba(80,50,20,.05);
  display: flex; flex-direction: column; gap: 8px;
}
.card h3 { margin: 0; font-size: 1.05rem; }
.badge {
  display: inline-block;
  font-size: .75rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: #efe4d2;
  color: var(--muted);
  width: fit-content;
}
.badge.ok { background: #e2f0e8; color: var(--ok); }
.badge.warn { background: #f5ebda; color: var(--warn); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.btn {
  display: inline-block;
  background: var(--bronze);
  color: #fffaf2 !important;
  padding: 8px 12px;
  border-radius: 10px;
  font-size: .9rem;
  text-decoration: none !important;
}
.btn.secondary { background: transparent; color: var(--bronze-dark) !important; border: 1px solid var(--bronze); }
footer { margin-top: 36px; color: var(--muted); font-size: .9rem; }
video {
  width: 100%;
  max-height: 70vh;
  background: #111;
  border-radius: 12px;
  margin: 16px 0;
}
.back { margin-bottom: 12px; display: inline-block; }
.meta { color: var(--muted); font-size: .92rem; }
@media (max-width: 560px) {
  .wrap { padding: 16px 12px 48px; }
  header.hero { padding: 22px 16px; }
}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← 返回课程门户</a>
  <header class="hero">
    <div class="brand">UNA · 全球历史</div>
    <h1>第2课 · 采集—农业转折</h1>
    <p>手机可播 · 本地双击打开即可</p>
  </header>
  
    <p class="badge warn">暂无有声片</p>
    <p class="meta">本课视频尚在制作流水线中。可先阅读讲义 HTML（若有）。</p>
    
  
  <footer>相对路径播放 · file:// 可用</footer>
</div>
</body>
</html>
